name: shared_secure_storage
description: "Secure key-value storage shared between Dart and native code, readable by native code before Flutter starts."
version: 0.1.0
repository: https://github.com/open-voip-alliance/shared-secure-storage

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.13

flutter:
  plugin:
    platforms:
      android:
        package: org.openvoipalliance.sharedsecurestorage
        pluginClass: SharedSecureStoragePlugin
      ios:
        pluginClass: SharedSecureStoragePlugin
